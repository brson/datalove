[workspace.package]
description = "todo"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
authors = ["Brian Anderson <andersrb@gmail.com>"]
documentation = "todo"
edition = "2024"

[workspace]
resolver = "2"

members = [
  "crates/*",
  "sys/std/rider",
]

default-members = [
  "crates/datalove-cli",
]

[workspace.dependencies]
rmx.package = "rustmax"
rmx.version = "0.0.10"
rmx.features = [
  "rmx-profile-portable",
  "comrak",
  "libc",
  "tera",
  "termcolor",
]
bct.package = "bcts"
bct.path = "crates/bcts"
serde.version = "1"
enum-iterator.version = "2"
salsa.version = "0.28.2"
ariadne.version = "0.4"

# Full DWARF for this workspace and its dependencies is the bulk of a target
# directory. `line-tables-only` keeps the file and line that a backtrace
# prints and drops the variable and type descriptions that only a debugger
# reads. Release is left at the default of no debuginfo at all.
[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
opt-level = "s"

# The native component is an archive that AOT-compiled programs link, and it
# is embedded in the datalove binary, so it is built for the code it emits
# rather than for datalove itself. Link-time optimization is off because it
# only fattens the archive with bitcode nothing here consumes.
[profile.native-component]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3

