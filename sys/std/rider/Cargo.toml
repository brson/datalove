[package]
name = "datalove-rider-sys-std"
description = "Native functions for the datalove sys/std package."
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not the workspace's 2024: the exported functions are written `#[no_mangle]`,
# which 2024 wants spelled `#[unsafe(no_mangle)]`.
edition = "2021"

[features]
index-64 = [
    "datalove-rtdt/index-64",
    "datalove-rti/index-64",
    "datalove-rt/index-64",
]

[dependencies]
datalove-rtdt.workspace = true
# The interface only. A rider declares the runtime functions it calls and
# resolves them against the runtime it is loaded into, rather than carrying a
# second copy of one.
datalove-rti.workspace = true

# A test harness is an executable, and an executable cannot leave the runtime
# functions this crate calls undefined the way a shared library can. So tests
# get a real runtime, while the library a program loads still gets none: a
# dev-dependency is not built into it.
[dev-dependencies]
datalove-rt.path = "../../../crates/datalove-rt"
