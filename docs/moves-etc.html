<h2>Argument modes and callee expressions</h2>
<ul>
<li><code>argument.clone</code></li>
<li><code>argument.move</code></li>
<li><code>argument.mut</code></li>
</ul>
<p>All binops and unary negation treat their arguments as <code>ref</code> arguments.
They do not move.</p>
