<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future types - Datalove</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">♡</a>
    </nav>
    <main>
        <h1>Future types</h1>
<ul>
<li>queues</li>
<li>ranges 1:2, 1:2:3</li>
<li>token types</li>
<li>datetimes</li>
<li>bitset</li>
<li>subranged ints</li>
<li>table (polars, arrow)</li>
<li>graph</li>
<li>range (python)?</li>
<li>complex?</li>
<li>real?</li>
<li>atoms / symbols / interned strings ?</li>
</ul>

    </main>
    <script data-manual src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script>
    Prism.languages.datalove = {
        'comment': [
            /\/\/.*/,
            /\/\*[\s\S]*?\*\//
        ],
        'string': /"(?:[^"\\]|\\.)*"/,
        'number': /\b\d+(?:\.\d+)?\b/,
        'boolean': /\b(?:true|false)\b/,
        'builtin': /\b(?:ok|er|some|none)\b/,
        'type-name': /\b(?:bool|u8|u16|u32|u64|i8|i16|i32|i64|int|f32|f64|list|map|set|tensor|data|error)\b/,
        'keyword': /\b(?:let|fun|ret|if|else|end|require|import|break|continue|loop|module|in|out|mut|ref|struct|enum)\b/,
        'operator': /\b(?:and|or|xor|implies|not)\b|[+\-*\/%!?<>=&|^~]+/,
        'function': /\b[a-z_][a-z0-9_]*(?=\s*\()/,
        'punctuation': /[{}()\[\];,.:]/
    };
    Prism.languages.datalit = Prism.languages.datalove;
    Prism.languages.datafun = Prism.languages.datalove;
    Prism.highlightAll();
    </script>
</body>
</html>
