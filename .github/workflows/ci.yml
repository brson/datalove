name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Debug info is around 85% of the size of a test binary here, and the
  # workspace produces enough of them to exhaust a runner's disk without it
  # being dropped. Nothing under test reads its own debug info; the two tests
  # that assert on a backtrace check the message, not the symbols.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # One runner per configuration. Each builds a different feature set, so
  # splitting them keeps any single runner's disk and wall clock down, and
  # reports a failure against the configuration that caused it.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one configuration says nothing about the others, so let
      # them all finish.
      fail-fast: false
      matrix:
        include:
          - name: default
            recipe: test
          - name: slow
            recipe: test-slow
          - name: index-64
            recipe: test-64
          # The interpreter-driven suites on the bytecode, whose debug build
          # verifies every body it lowers: the bytecode reads and writes
          # frames through raw offsets, and this is what checks them.
          - name: bytecode
            recipe: test-bc
          # The same suite under DATALOVE_PARALLEL=1. It has been run green by
          # hand many times, which is not the same as anything holding it.
          - name: parallel
            recipe: test-parallel
    steps:
      - uses: actions/checkout@v4

      # A full debug build of this workspace does not fit in the ~14GB a
      # hosted runner leaves free, and the linker dies with SIGBUS partway
      # through rather than reporting ENOSPC. Reclaim the preinstalled
      # toolchains, none of which this build uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Only test-slow's check-wasm needs this, but installing it
          # everywhere costs seconds and keeps the matrix uniform.
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The configurations share no artifacts, so they cache separately.
          key: ${{ matrix.recipe }}

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run tests
        run: just ${{ matrix.recipe }}
