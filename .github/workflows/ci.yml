name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Debug info is around 85% of the size of a test binary here, and the
  # workspace produces enough of them to exhaust a runner's disk without it
  # being dropped. Nothing under test reads its own debug info; the two tests
  # that assert on a backtrace check the message, not the symbols.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # One runner per configuration. Each builds a different feature set, so
  # splitting them keeps any single runner's disk and wall clock down, and
  # reports a failure against the configuration that caused it.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one configuration says nothing about the others, so let
      # them all finish.
      fail-fast: false
      matrix:
        include:
          - name: default
            recipe: test
          # Everything that is not the suite in another configuration: the
          # slow_tests property and exhaustive tests, the wasm build and the
          # wasm smoke test, a smoke test of sys riders built from source,
          # generated programs on a
          # fixed seed, and the benchvs programs and the store demo built in
          # release.
          - name: extras
            recipe: test-extras
          - name: index-64
            recipe: test-64
          # The suite again with every datalit collection parsed in chunks;
          # see `just test-cut` and botdocs/plan-parallel-collections.md.
          - name: cut
            recipe: test-cut
    steps:
      - uses: actions/checkout@v4

      # A full debug build of this workspace does not fit in the ~14GB a
      # hosted runner leaves free, and the linker dies with SIGBUS partway
      # through rather than reporting ENOSPC. Reclaim the preinstalled
      # toolchains, none of which this build uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Only test-slow's check-wasm and test-wasm need this, but installing it
          # everywhere costs seconds and keeps the matrix uniform.
          targets: wasm32-unknown-unknown
          # `just test` checks the hash container rule with clippy.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The configurations share no artifacts, so they cache separately.
          key: ${{ matrix.recipe }}

      - name: Install just
        uses: taiki-e/install-action@just

      # Python, through uv: `just test` checks the generated runtime interface
      # with it, and the store demo generates its data and checks its report.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: just ${{ matrix.recipe }}

  # The Lean model of the type system in formal/: its proofs checked, and the
  # Rust held to its oracle. See botdocs/formal.md. Its own job, since it needs
  # Lean and none of the rest does, and it builds only the crates the oracle
  # tests use.
  formal:
    name: formal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: formal

      - name: Install just
        uses: taiki-e/install-action@just

      # elan, with no toolchain of its own: `lake` fetches the one
      # formal/lean-toolchain pins on first use.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the proofs and run the oracle tests
        run: just test-formal
