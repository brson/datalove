name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Debug info is around 85% of the size of a test binary here, and the
  # workspace produces enough of them to exhaust a runner's disk without it
  # being dropped. Nothing under test reads its own debug info; the two tests
  # that assert on a backtrace check the message, not the symbols.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A full debug build of this workspace does not fit in the ~14GB a
      # hosted runner leaves free, and the linker dies with SIGBUS partway
      # through rather than reporting ENOSPC. Reclaim the preinstalled
      # toolchains, none of which this build uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run tests
        run: just test-ci

  # index-64 changes the width of `index` and `offset`, so it builds different
  # artifacts and exercises the `.out.expected.64` fixtures. It gets its own
  # runner rather than a step on the one above, so a failure in either
  # configuration is reported separately and neither waits on the other.
  test-index-64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A full debug build of this workspace does not fit in the ~14GB a
      # hosted runner leaves free, and the linker dies with SIGBUS partway
      # through rather than reporting ENOSPC. Reclaim the preinstalled
      # toolchains, none of which this build uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from the default build's cache; the two share no artifacts.
          key: index-64

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run tests
        run: just test-64
