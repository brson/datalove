[package]
name = "datalove-repl"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
datalove-datafun.path = "../datalove-datafun"
datalove-datafun-ir.path = "../datalove-datafun-ir"
# For `Setter`, which is what editing a unit's source is.
salsa.workspace = true
serde = { version = "1.0", features = ["derive"] }
# For the work dir, where riders are built when they are not linked in.
datalove-paths.path = "../datalove-paths"

[dev-dependencies]
# The engine tests run against the system library the binary ships.
datalove-sys-packages.path = "../../sys"
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "engine_tests"
harness = false
