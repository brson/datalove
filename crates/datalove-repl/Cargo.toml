[package]
name = "datalove-repl"
description = "The datalove REPL."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rmx.workspace = true
datalove-datafun.workspace = true
datalove-script-engine.workspace = true
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# The engine tests run against the system library the binary ships.
datalove-sys-packages.workspace = true
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "engine_tests"
harness = false
