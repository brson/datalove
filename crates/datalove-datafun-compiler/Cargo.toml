[package]
name = "datalove-datafun-compiler"
description = "The datafun compiler, as one crate over its passes."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[features]
slow_tests = []
index-64 = [
    "datalove-rtdt/index-64",
    "datalove-datafun-common/index-64",
    "datalove-datafun-const/index-64",
    "datalove-datafun-ir/index-64",
    "datalove-datafun-lower/index-64",
    "datalove-datafun-ownership/index-64",
    "datalove-datafun-sema/index-64",
    "datalove-datafun-tycheck/index-64",
    "datalove-datafun-parser/index-64",
    "datalove-datafun-intrinsics/index-64",
    "datalove-datalit/index-64",
]

[dependencies]
rmx.workspace = true
bct.workspace = true
salsa.workspace = true
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
ron = "0.8"
datalove-ct.workspace = true
datalove-datafun-ast.workspace = true
datalove-datafun-common.workspace = true
datalove-datafun-const.workspace = true
datalove-datafun-intrinsics.workspace = true
datalove-datafun-ir.workspace = true
datalove-datafun-lower.workspace = true
datalove-datafun-ownership.workspace = true
datalove-datafun-parser.workspace = true
datalove-datafun-resolve.workspace = true
datalove-datafun-sema.workspace = true
datalove-datafun-tycheck.workspace = true
datalove-datalit.workspace = true
datalove-diagnostic.workspace = true
datalove-rt.workspace = true
datalove-rtdt.workspace = true

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"
datalove-datafun-pkg.workspace = true
rand = "0.8"

[[test]]
name = "parser_tests"
path = "tests/parser_tests.rs"
harness = false

[[test]]
name = "tycheck_tests"
path = "tests/tycheck_tests.rs"
harness = false

