[package]
name = "datalove-script-engine"
description = "The datalove interactive scripting engine."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rmx.workspace = true
datalove-datafun.workspace = true
datalove-datafun-ir.workspace = true
bct.workspace = true
# For `Setter`, which is what editing a unit's source is.
salsa.workspace = true
serde = { version = "1.0", features = ["derive"] }
# For the work dir, where riders are built when they are not linked in.
datalove-paths.workspace = true
# For `unit_analysis`, which says which units a step analyzed.
datalove-ct.workspace = true

[dev-dependencies]
# The engine tests run against the system library the binary ships.
datalove-sys-packages.workspace = true
