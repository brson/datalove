<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalove REPL</title>
    <!-- Main application WASM -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="datalove_repl_egui" />
    <!-- Copy worker files to dist root -->
    <link data-trunk rel="copy-dir" href="worker-dist" />
    <script type="module">
        window.addEventListener('TrunkApplicationStarted', async () => {
            await window.wasmBindings.start();
        });
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
</body>
</html>
