[package]
name = "datalove-repl-egui"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rmx.workspace = true
datalove-repl.path = "../datalove-repl"
datalove-repl-rat.path = "../datalove-repl-rat"
egui = "0.32"
egui_ratatui = "2.0"
soft_ratatui = "0.1"
ratatui = { version = "0.29", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.32"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = "0.32"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }

# Configure both getrandom versions that are pulled in as dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2"
features = ["js"]

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom_v3]
package = "getrandom"
version = "0.3"
features = ["wasm_js"]
