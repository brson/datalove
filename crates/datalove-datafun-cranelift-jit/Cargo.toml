[package]
name = "datalove-datafun-cranelift-jit"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
datalove-datafun-ir.path = "../datalove-datafun-ir"
datalove-datafun-interp.path = "../datalove-datafun-interp"
datalove-datafun-cranelift.path = "../datalove-datafun-cranelift"
datalove-rtdt.path = "../datalove-rtdt"
datalove-rt.path = "../datalove-rt"

cranelift-codegen = "0.128"
cranelift-frontend = "0.128"
cranelift-module = "0.128"
cranelift-jit = "0.128"
target-lexicon = "0.13"

[dev-dependencies]
datalove-datafun.path = "../datalove-datafun"

[features]
index-64 = [
    "datalove-datafun-ir/index-64",
    "datalove-datafun-interp/index-64",
    "datalove-datafun-cranelift/index-64",
    "datalove-rtdt/index-64",
    "datalove-rt/index-64",
]
