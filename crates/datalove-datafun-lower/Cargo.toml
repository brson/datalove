[package]
name = "datalove-datafun-lower"
description = "Lowering datafun syntax to SSA IR."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# Generics by reference (botdocs/plan-fat-generics.md): a generic's values
# keep their written types, with type parameters in them, rather than being
# erased to `data`. Its own test configuration until it is the only one.
fat-generics = []
index-64 = [
    "datalove-rtdt/index-64",
    "datalove-datafun-ir/index-64",
    "datalove-datafun-common/index-64",
    "datalove-datafun-intrinsics/index-64",
    "datalove-datafun-sema/index-64",
]

[dependencies]
rmx.workspace = true
salsa.workspace = true
bct.workspace = true
datalove-datalit.workspace = true
datalove-datafun-ast.workspace = true
datalove-datafun-common.workspace = true
datalove-datafun-intrinsics.workspace = true
datalove-datafun-ir.workspace = true
datalove-datafun-sema.workspace = true
datalove-rtdt.workspace = true
