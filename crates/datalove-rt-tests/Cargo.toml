[package]
name = "datalove-rt-tests"
description = "Tests for the datalove runtime."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
# Tests, not a library anybody installs.
publish = false
repository.workspace = true

[features]
slow_tests = []
index-64 = ["datalove-rt/index-64", "datalove-rtdt/index-64", "datalove-datalit/index-64"]

[dependencies]
rmx = { workspace = true, features = ["proptest"] }
bct.workspace = true
salsa.workspace = true
datalove-rt.workspace = true
datalove-rtdt.workspace = true
datalove-datalit.workspace = true
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "roundtrip_tests"
path = "tests/roundtrip_tests.rs"
harness = false
