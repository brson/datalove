[package]
name = "datalove-datalit"
description = "The datalit data language: syntax, types and values."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[features]
index-64 = ["datalove-rtdt/index-64"]

[dependencies]
rmx.workspace = true
bct.workspace = true
salsa.workspace = true
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
datalove-diagnostic.workspace = true
datalove-rtdt.workspace = true
datalove-rt.workspace = true
rand = "0.8"
num-traits = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "parser_tests"
path = "tests/parser_tests.rs"
harness = false

[[test]]
name = "resolve_tests"
path = "tests/resolve_tests.rs"
harness = false

[[test]]
name = "tycheck_tests"
path = "tests/tycheck_tests.rs"
harness = false

[[test]]
name = "pretty_tests"
path = "tests/pretty_tests.rs"
harness = false

[[test]]
name = "roundtrip_tests"
path = "tests/roundtrip_tests.rs"
harness = false
