[package]
name = "datalove-datafun"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
bct.workspace = true
salsa.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
datalove-ct.path = "../datalove-ct"
datalove-datafun-ast.path = "../datalove-datafun-ast"
datalove-datafun-common.path = "../datalove-datafun-common"
datalove-datafun-const.path = "../datalove-datafun-const"
datalove-datafun-parser.path = "../datalove-datafun-parser"
datalove-datafun-ir.path = "../datalove-datafun-ir"
datalove-datafun-compiler.path = "../datalove-datafun-compiler"
datalove-datafun-tycheck.path = "../datalove-datafun-tycheck"
datalove-datafun-resolve.path = "../datalove-datafun-resolve"
datalove-datafun-interp.path = "../datalove-datafun-interp"
datalove-datafun-pkg.path = "../datalove-datafun-pkg"
datalove-rt.path = "../datalove-rt"
datalove-diagnostic.path = "../datalove-diagnostic"
datalove-datafun-cranelift-aot.path = "../datalove-datafun-cranelift-aot"

[features]
default = []
index-64 = [
    "datalove-rt/index-64",
    "datalove-datafun-common/index-64",
    "datalove-datafun-const/index-64",
    "datalove-datafun-interp/index-64",
    "datalove-datafun-ir/index-64",
    "datalove-datafun-inline/index-64",
    "datalove-datafun-compiler/index-64",
    "datalove-datafun-cranelift-aot/index-64",
    "datalove-exampletest/index-64",
]

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"
datalove-datalit.path = "../datalove-datalit"
datalove-diagnostic.path = "../datalove-diagnostic"
datalove-datafun-cranelift-jit.path = "../datalove-datafun-cranelift-jit"
datalove-datafun-inline.path = "../datalove-datafun-inline"
datalove-rtdt.path = "../datalove-rtdt"
regex = "1"
ron = "0.8"
serde_json = "1"

[[test]]
name = "tycheck_world_tests"
path = "tests/tycheck_world_tests.rs"
harness = false

[[test]]
name = "std_tests"
path = "tests/std_tests.rs"
harness = false

