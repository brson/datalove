[package]
name = "datalove-datafun"
description = "The datafun language: compiling and running it."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rmx.workspace = true
bct.workspace = true
salsa.workspace = true
serde = { version = "1", features = ["derive"] }
datalove-ct.workspace = true
datalove-datafun-ast.workspace = true
datalove-datafun-common.workspace = true
datalove-datafun-const.workspace = true
datalove-datafun-parser.workspace = true
datalove-datafun-ir.workspace = true
datalove-datafun-compiler.workspace = true
datalove-datafun-tycheck.workspace = true
datalove-datafun-resolve.workspace = true
datalove-datafun-interp.workspace = true
datalove-datafun-pkg.workspace = true
datalove-buildinfo.workspace = true
datalove-rtdt.workspace = true
# For `ABI_VERSION`, which a rider library is checked against when loaded.
datalove-rti.workspace = true
datalove-rt.workspace = true
datalove-diagnostic.workspace = true
datalove-datafun-cranelift-aot.workspace = true
datalove-datafun-c-aot.workspace = true

# Wasm has no shared libraries to load.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"

[features]
default = []
index-64 = [
    "datalove-rt/index-64",
    "datalove-datafun-common/index-64",
    "datalove-datafun-const/index-64",
    "datalove-datafun-interp/index-64",
    "datalove-datafun-ir/index-64",
    "datalove-datafun-compiler/index-64",
    "datalove-datafun-cranelift-aot/index-64",
    "datalove-datafun-c-aot/index-64",
    "datalove-exampletest/index-64",
]

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"
datalove-datalit.workspace = true
datalove-diagnostic.workspace = true
datalove-datafun-cranelift-jit.workspace = true
ron = "0.8"

[[test]]
name = "tycheck_world_tests"
path = "tests/tycheck_world_tests.rs"
harness = false

[[test]]
name = "std_engine_tests"
path = "tests/std_engine_tests.rs"
harness = false

[[test]]
name = "ir_lower_tests"
path = "tests/ir_lower_tests.rs"
harness = false

[[test]]
name = "ir_lower_script_tests"
path = "tests/ir_lower_script_tests.rs"
harness = false

[[test]]
name = "engine_tests"
path = "tests/engine_tests.rs"
harness = false

[[test]]
name = "ir_serial_tests"
path = "tests/ir_serial_tests.rs"
harness = false

[[test]]
name = "module_memo_tests"
path = "tests/module_memo_tests.rs"
harness = false

[[test]]
name = "layout_conformance_tests"
path = "tests/layout_conformance_tests.rs"
