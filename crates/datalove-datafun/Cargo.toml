[package]
name = "datalove-datafun"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
bct.workspace = true
salsa.workspace = true
serde = { version = "1", features = ["derive"] }
datalove-datafun-ast.path = "../datalove-datafun-ast"
datalove-datafun-parser.path = "../datalove-datafun-parser"
datalove-datafun-ir.path = "../datalove-datafun-ir"
datalove-datafun-compiler.path = "../datalove-datafun-compiler"
datalove-datafun-tycheck.path = "../datalove-datafun-tycheck"
datalove-datafun-interp.path = "../datalove-datafun-interp"
datalove-datafun-pkg.path = "../datalove-datafun-pkg"
datalove-rt.path = "../datalove-rt"
datalove-diagnostic.path = "../datalove-diagnostic"
datalove-datafun-analysis = { path = "../datalove-datafun-analysis", features = ["all"] }
datalove-datafun-aot-cranelift.path = "../datalove-datafun-aot-cranelift"
tempfile = "3"

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"
datalove-datalit.path = "../datalove-datalit"
datalove-diagnostic.path = "../datalove-diagnostic"
ron = "0.8"

[[test]]
name = "tycheck_world_tests"
path = "tests/tycheck_world_tests.rs"
harness = false

[[test]]
name = "std_tests"
path = "tests/std_tests.rs"
harness = false

[[test]]
name = "ir_lower_tests"
path = "tests/ir_lower_tests.rs"
harness = false

[[test]]
name = "ir_lower_script_tests"
path = "tests/ir_lower_script_tests.rs"
harness = false

[[test]]
name = "module_interp_tests"
path = "tests/module_interp_tests.rs"
harness = false

[[test]]
name = "interp_tests"
path = "tests/interp_tests.rs"
harness = false

[[test]]
name = "aot_tests"
path = "tests/aot_tests.rs"
harness = false

[[test]]
name = "dual_tests"
path = "tests/dual_tests.rs"
harness = false

[[test]]
name = "analysis_tests"
path = "tests/analysis_tests.rs"
harness = false
