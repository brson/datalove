[package]
name = "datalove-repl-rat"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
datalove-repl.path = "../datalove-repl"
ratatui = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.28"
tui-textarea = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope"] }
js-sys = "0.3"
tui-textarea = { version = "0.7", default-features = false, features = ["no-backend"] }

[dev-dependencies]
termcolor = "1.4"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
datalove-repl-term.path = "../datalove-repl-term"

[[test]]
name = "repl_tests"
path = "tests/repl_tests.rs"
harness = false
