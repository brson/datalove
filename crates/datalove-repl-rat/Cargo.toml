[package]
name = "datalove-repl-rat"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
datalove-repl.path = "../datalove-repl"
ratatui = { version = "0.29", default-features = false }

[dev-dependencies]
termcolor = "1.4"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
datalove-repl-term.path = "../datalove-repl-term"

[[test]]
name = "repl_tests"
path = "tests/repl_tests.rs"
harness = false
