[package]
name = "datalove-rt"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[features]
slow_tests = []
index-64 = ["datalove-rtdt/index-64"]

[dependencies]
rmx.workspace = true
datalove-rtdt = { path = "../datalove-rtdt" }

# Proptest is only enabled here so that it stays out of the wasm build,
# where its getrandom dependency does not compile.
[dev-dependencies]
rmx = { workspace = true, features = ["proptest"] }
