[package]
name = "datalove-repl-worker"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
authors = ["Brian Anderson <andersrb@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "DedicatedWorkerGlobalScope", "MessageEvent"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
datalove-repl = { path = "../datalove-repl" }
datalove-repl-rat = { path = "../datalove-repl-rat", default-features = false }
