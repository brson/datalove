[package]
name = "datalove-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
bct.workspace = true
datalove.path = "../datalove"
datalove-datalit.path = "../datalove-datalit"
datalove-datafun.path = "../datalove-datafun"
datalove-diagnostic.path = "../datalove-diagnostic"
datalove-rt.path = "../datalove-rt"
datalove-repl.path = "../datalove-repl"
datalove-repl-term.path = "../datalove-repl-term"
pulldown-cmark = "0.12"
syntect = "5.2"
comrak = "0.32"

[[bin]]
name = "datalove"
path = "src/main.rs"

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "script_tests"
path = "tests/script_tests.rs"
harness = false

[[test]]
name = "error_tests"
path = "tests/error_tests.rs"
harness = false

[[test]]
name = "type_error_tests"
path = "tests/type_error_tests.rs"
harness = false
