[package]
name = "datalove-cli"
description = "The datalove command line driver."
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rmx.workspace = true
serde = { version = "1", features = ["derive"] }
datalove-buildinfo.workspace = true
megaspace-pipeliner = { version = "0.3", path = "../../megaspace-one/crates/megaspace-pipeliner" }
datalove.workspace = true
datalove-repl-rat.workspace = true
datalove-worldgen.workspace = true
pulldown-cmark = "0.12"
rand = "0.8"

[[bin]]
name = "datalove"
path = "src/main.rs"

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "script_tests"
path = "tests/script_tests.rs"
harness = false

[[test]]
name = "error_tests"
path = "tests/error_tests.rs"
harness = false

[[test]]
name = "aot_error_tests"
path = "tests/aot_error_tests.rs"
harness = false

[[test]]
name = "aot_run_tests"
path = "tests/aot_run_tests.rs"
harness = false

[[test]]
name = "world_error_tests"
path = "tests/world_error_tests.rs"
harness = false

[[test]]
name = "backend_tests"
harness = false

[[test]]
name = "workspace_tests"
path = "tests/workspace_tests.rs"
harness = false
