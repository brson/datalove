[package]
name = "datalove-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
rmx.workspace = true
serde = { version = "1", features = ["derive"] }
datalove-buildinfo.path = "../datalove-buildinfo"
megaspace-pipeliner = "0.1"
bct.workspace = true
datalove.path = "../datalove"
datalove-datalit.path = "../datalove-datalit"
datalove-datafun.path = "../datalove-datafun"
datalove-datafun-ir.path = "../datalove-datafun-ir"
datalove-datafun-interp.path = "../datalove-datafun-interp"
datalove-datafun-cranelift-jit.path = "../datalove-datafun-cranelift-jit"
datalove-diagnostic.path = "../datalove-diagnostic"
datalove-datafun-parser.path = "../datalove-datafun-parser"
datalove-datafun-sema.path = "../datalove-datafun-sema"
datalove-datafun-ast.path = "../datalove-datafun-ast"
datalove-rt.path = "../datalove-rt"
datalove-repl.path = "../datalove-repl"
datalove-stdlib.path = "../datalove-stdlib"
datalove-repl-rat.path = "../datalove-repl-rat"
datalove-datafun-pkg.path = "../datalove-datafun-pkg"
datalove-worldgen.path = "../datalove-worldgen"
pulldown-cmark = "0.12"
rand = "0.8"
salsa.workspace = true

[[bin]]
name = "datalove"
path = "src/main.rs"

[dev-dependencies]
datalove-exampletest.path = "../datalove-exampletest"

[[test]]
name = "script_tests"
path = "tests/script_tests.rs"
harness = false

[[test]]
name = "error_tests"
path = "tests/error_tests.rs"
harness = false

[[test]]
name = "aot_error_tests"
path = "tests/aot_error_tests.rs"
harness = false

[[test]]
name = "aot_run_tests"
path = "tests/aot_run_tests.rs"
harness = false

[[test]]
name = "world_error_tests"
path = "tests/world_error_tests.rs"
harness = false

[[test]]
name = "backend_tests"
harness = false
