# One fault per reach rule, for `scripts/faults.py`: each breaks the rule it
# names by replacing `find`, which must appear in `file` exactly once, with
# `replace`. The names are the rows of the planted-fault table in
# botdocs/script-reactivity-architecture.md.
#
# A fault whose `find` no longer matches is a rule whose code has moved:
# `just faults-check` says which, and the fault is written again against the
# code as it is.

[[fault]]
id = "F1"
name = "no backward rule"
file = "crates/datalove-datafun/src/driver/script_compiler.rs"
find = """
                    if since {
                        added |= rerun_starts.insert(setter);"""
replace = """
                    if false && since {
                        added |= rerun_starts.insert(setter);"""

[[fault]]
id = "F2"
name = "the forward rule reaches only the seeds"
file = "crates/datalove-datafun/src/driver/script_compiler.rs"
find = """
        // The units rerun to restore a binding,"""
replace = """
        let rederived: Vec<bool> = (0..count).map(|unit| seeds.contains(&unit)).collect();
        // The units rerun to restore a binding,"""

[[fault]]
id = "F3"
name = "a rerun reruns no one after it"
file = "crates/datalove-datafun/src/driver/script_compiler.rs"
find = ".is_some_and(|source| rederived[source] || restoring[source])"
replace = ".is_some_and(|source| false && (rederived[source] || restoring[source]))"

[[fault]]
id = "F4"
name = "no restore of a shadowed binding"
file = "crates/datalove-datafun/src/driver/script_compiler.rs"
find = """
                    if !reached(setter) {
                        added |= rerun_starts.insert(setter);"""
replace = """
                    if false && !reached(setter) {
                        added |= rerun_starts.insert(setter);"""

[[fault]]
id = "F5"
name = "a reorder's restore in the new order"
file = "crates/datalove-datafun/src/driver/script_compiler.rs"
find = "self.rederive_reach(seeds, restore, Some((from, to)))"
replace = "self.rederive_reach(seeds, restore, None)"

[[fault]]
id = "F7"
name = "a departure's restore by the typecheck"
file = "crates/datalove-datafun/src/driver/script_compiler.rs"
find = """
                    let record = &self.unit_records[*unit];
                    [&record.provides, &record.overwrites, &record.revives]"""
replace = """
                    let record = &self.unit_records[*unit];
                    now_provides[*unit].contains(name) || [&record.provides, &record.overwrites, &record.revives]"""

[[fault]]
id = "F8"
name = "a rerun reports the nearest binding"
file = "crates/datalove-script-engine/src/engine.rs"
find = "let held = self.state.executor.unit_bindings(id);"
replace = "let ids: Vec<u32> = self.state.executor.unit_ids().to_vec(); let held: Vec<_> = ids.iter().flat_map(|unit| self.state.executor.unit_bindings(*unit)).collect();"

